global:
  # Bắt buộc truyền từ PERSONAL_WEB_EXTERNAL_URL trong file .env.
  externalUrl: ""

existingSecret: platform-secrets

# Secret để kéo image private (vd. GHCR): [{ name: ghcr-pull }]. Để trống nếu image public.
imagePullSecrets: []

frontend:
  replicas: 2
  image:
    repository: personal-web/frontend
    tag: local
    pullPolicy: IfNotPresent
  service:
    # NodePort: mở thẳng cổng trên node (không cần Ingress). ClusterIP: khi dùng Ingress (Kong) phía trước.
    type: NodePort
    nodePort: 0
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

backend:
  replicas: 2
  image:
    repository: personal-web/backend
    tag: local
    pullPolicy: IfNotPresent
  config:
    appEnv: kubernetes
    # Bắt buộc truyền từ PERSONAL_WEB_CONTACT_RECEIVER_EMAIL trong file .env.
    contactReceiverEmail: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

worker:
  replicas: 1
  concurrency: 2
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

keycloak:
  replicas: 1
  image: quay.io/keycloak/keycloak:26.4
  realm: personal-web
  clientId: portfolio-frontend
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { cpu: "1", memory: 1Gi }

postgres:
  image: postgres:17-alpine
  storage: 2Gi
  storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: 500m, memory: 512Mi }

redis:
  image: redis:7.4-alpine
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 250m, memory: 256Mi }

mailpit:
  image: axllent/mailpit:v1.27
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# -----------------------------------------------------------------------------
# Ingress qua Kong Ingress Controller (cài riêng: helm install kong kong/ingress -n kong)
# Kong xử lý rate limit, request ID, giới hạn body, metrics — khai báo bằng KongPlugin bên dưới.
# -----------------------------------------------------------------------------
ingress:
  enabled: false
  className: kong
  # Ví dụ lab không cần DNS: personal-web.192.168.0.111.nip.io (nip.io tự trỏ về IP trong tên)
  host: ""
  annotations: {}

kongPlugins:
  rateLimit:
    apiPerMinute: 120 # mỗi IP, toàn bộ /api
    contactPerMinute: 5 # mỗi IP, POST /api/contact
  requestSizeLimitMb: 1
  prometheus: true # Kong xuất metrics theo service/route (cổng status của Kong)

# -----------------------------------------------------------------------------
# HorizontalPodAutoscaler (cần metrics-server trong cluster)
# -----------------------------------------------------------------------------
autoscaling:
  backend:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  frontend:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    targetCPUUtilizationPercentage: 70
