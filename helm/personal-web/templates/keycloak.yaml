apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  realm-export.json: |
    {
      "realm": {{ .Values.keycloak.realm | quote }},
      "displayName": "Personal Web Platform",
      "enabled": true,
      "registrationAllowed": false,
      "loginWithEmailAllowed": true,
      "sslRequired": "none",
      "roles": {"realm": [
        {"name": "portfolio-user"},
        {"name": "portfolio-admin"}
      ]},
      "clients": [{
        "clientId": {{ .Values.keycloak.clientId | quote }},
        "enabled": true,
        "publicClient": true,
        "standardFlowEnabled": true,
        "protocol": "openid-connect",
        "redirectUris": [{{ printf "%s/*" (required "global.externalUrl must be supplied from .env" .Values.global.externalUrl) | quote }}],
        "webOrigins": [{{ required "global.externalUrl must be supplied from .env" .Values.global.externalUrl | quote }}],
        "attributes": {
          "pkce.code.challenge.method": "S256",
          "post.logout.redirect.uris": {{ printf "%s/*" .Values.global.externalUrl | quote }}
        }
      }]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  replicas: {{ .Values.keycloak.replicas }}
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.keycloak.image }}
          args:
            - start-dev
            - --import-realm
            - --http-relative-path=/auth
            - --proxy-headers=xforwarded
            - --hostname-strict=false
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: keycloak-admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: keycloak-admin-password }
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: postgres
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.existingSecret }}, key: postgres-password }
          readinessProbe:
            httpGet: { path: /auth/realms/master, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            {{- toYaml .Values.keycloak.resources | nindent 12 }}
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
