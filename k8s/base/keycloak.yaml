apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
  realm-export.json: |
    {
      "realm": "personal-web",
      "displayName": "Personal Web Platform",
      "enabled": true,
      "registrationAllowed": true,
      "loginWithEmailAllowed": true,
      "sslRequired": "external",
      "roles": {"realm": [
        {"name": "portfolio-user"},
        {"name": "portfolio-admin"}
      ]},
      "clients": [{
        "clientId": "portfolio-frontend",
        "enabled": true,
        "publicClient": true,
        "standardFlowEnabled": true,
        "protocol": "openid-connect",
        "redirectUris": ["http://localhost:30080/*"],
        "webOrigins": ["http://localhost:30080"],
        "attributes": {"pkce.code.challenge.method": "S256"}
      }],
      "users": [{
        "username": "hai",
        "enabled": true,
        "emailVerified": true,
        "email": "hai@example.com",
        "credentials": [{"type": "password", "value": "ChangeMe123!", "temporary": false}],
        "realmRoles": ["portfolio-user", "portfolio-admin"]
      }]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.4
          args: ["start-dev", "--import-realm", "--http-relative-path=/auth", "--proxy-headers=xforwarded", "--hostname-strict=false"]
          ports:
            - containerPort: 8080
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: keycloak-admin }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: keycloak-admin-password }
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak
            - name: KC_DB_USERNAME
              value: postgres
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: postgres-password }
          readinessProbe:
            httpGet: { path: /auth/realms/master, port: 8080 }
            initialDelaySeconds: 45
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm

