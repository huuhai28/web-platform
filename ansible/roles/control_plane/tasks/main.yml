- name: Kiểm tra cluster đã khởi tạo chưa
  ansible.builtin.stat:
    path: "{{ kubeconfig_admin }}"
  register: admin_conf

- name: Chạy kubeadm init
  ansible.builtin.command: >-
    kubeadm init
    --pod-network-cidr={{ pod_network_cidr }}
    --apiserver-advertise-address={{ private_ip }}
    --apiserver-cert-extra-sans={{ ansible_host }},{{ private_ip }}
  when: not admin_conf.stat.exists
  register: kubeadm_init
  changed_when: true

- name: Kubeconfig cho user ubuntu (để chạy kubectl không cần sudo)
  ansible.builtin.copy:
    src: "{{ kubeconfig_admin }}"
    dest: /home/ubuntu/.kube/config
    remote_src: true
    owner: ubuntu
    group: ubuntu
    mode: "0600"
  become: true

- name: Thư mục .kube thuộc về ubuntu
  ansible.builtin.file:
    path: /home/ubuntu/.kube
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: "0700"

- name: Cài Flannel CNI
  ansible.builtin.command: >-
    kubectl apply -f https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml
  environment:
    KUBECONFIG: "{{ kubeconfig_admin }}"
  register: flannel
  changed_when: "'created' in flannel.stdout or 'configured' in flannel.stdout"

- name: Tạo lệnh join cho worker (token sống 2 giờ)
  ansible.builtin.command: kubeadm token create --print-join-command --ttl 2h
  register: join_cmd
  changed_when: false

- name: Lưu lệnh join để play worker dùng
  ansible.builtin.set_fact:
    kubeadm_join_command: "{{ join_cmd.stdout }}"

- name: Tải kubeconfig về máy chạy Ansible
  ansible.builtin.fetch:
    src: "{{ kubeconfig_admin }}"
    dest: "{{ artifacts_dir }}/kubeconfig"
    flat: true

- name: Kubeconfig trên máy bạn trỏ tới IP public của control plane
  ansible.builtin.replace:
    path: "{{ artifacts_dir }}/kubeconfig"
    regexp: 'server: https://[^:]+:6443'
    replace: "server: https://{{ ansible_host }}:6443"
  delegate_to: localhost
  become: false
