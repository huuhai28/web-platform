name: personal-web-platform

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: portfolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin_dev_password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_ISSUER: http://localhost:3000/auth/realms/personal-web
      KEYCLOAK_REALM: personal-web
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-hai@example.com}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:-postgres_dev_password}@postgres:5432/portfolio
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      CONTACT_RECEIVER_EMAIL: ${CONTACT_RECEIVER_EMAIL:-hai@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
      - keycloak
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

