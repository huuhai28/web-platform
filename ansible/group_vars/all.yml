metrics_server_version: "v0.7.2"
local_path_provisioner_version: "v0.0.30"
helm_version: "v3.16.4"

kubeconfig_admin: /etc/kubernetes/admin.conf
artifacts_dir: "{{ playbook_dir }}/artifacts"
