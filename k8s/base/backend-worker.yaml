apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  APP_ENV: kubernetes
  REDIS_URL: redis://redis:6379/0
  KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
  KEYCLOAK_ISSUER: http://localhost:30080/auth/realms/personal-web
  KEYCLOAK_REALM: personal-web
  CORS_ORIGINS: http://localhost:30080
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  CONTACT_RECEIVER_EMAIL: hai@example.com
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: personal-web/backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: postgres-password }
            - name: DATABASE_URL
              value: postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/portfolio
          readinessProbe:
            httpGet: { path: /api/health, port: 8000 }
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: personal-web/backend:local
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
          envFrom:
            - configMapRef: { name: backend-config }
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: platform-secrets, key: postgres-password }
            - name: DATABASE_URL
              value: postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/portfolio
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }

