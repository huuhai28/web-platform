# Phiên bản cố định để dựng lại cluster giống hệt nhau
k8s_minor_version: "v1.33" # repo pkgs.k8s.io theo minor version
pod_network_cidr: "10.244.0.0/16" # mặc định của Flannel, không trùng VPC 10.10.0.0/16 hay LAN 192.168.x
